name: CoreShiftDungeonMobs
version: 1.4.0
main: com.coreshift.dungeonmobs.DungeonMobsPlugin
api-version: '1.16'
author: 'Core Shift'
softdepend: [Vault]
commands:
  mob:
    description: CoreShift zindan mob yonetimi
    usage: /mob <create|addspawner|removespawner|delete|spawn|list|reload>
    aliases: [dungeonmob, zmob]
    permission: coreshift.mob.admin
permissions:
  coreshift.mob.admin:
    description: Tum zindan mob yonetim komutlari
    default: op
